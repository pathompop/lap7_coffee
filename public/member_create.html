<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก | Coffee Shop</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f3ef; color: #30261f; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
    h1 { color: #5b3825; }
    form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 12px #30261f14; }
    label { display: block; margin: 14px 0 6px; color: #5b3825; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cfc1b6; border-radius: 6px; font-size: 1rem; }
    button, a { display: inline-block; margin-top: 20px; padding: 11px 18px; border: 0; border-radius: 6px; font-size: 1rem; text-decoration: none; }
    button { background: #74482e; color: #fff; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: #74482e; margin-left: 8px; }
    .message { min-height: 24px; margin-top: 16px; color: #a32929; }
  </style>
</head>
<body>
  <main>
    <h1>สมัครสมาชิก</h1>
    <form id="member-create-form" novalidate>
      <label for="name">ชื่อสมาชิก</label>
      <input id="name" name="name" maxlength="150" required autocomplete="name">
      <label for="phone">เบอร์โทรศัพท์</label>
      <input id="phone" name="phone" maxlength="30" required inputmode="tel" autocomplete="tel">
      <div id="message" class="message" role="alert"></div>
      <button type="submit">บันทึกสมาชิก</button>
      <a href="/">กลับรายชื่อสมาชิก</a>
    </form>
  </main>
  <script src="/member_create.js" defer></script>
</body>
</html>
