<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมาชิกและแต้มสะสม | Coffee Shop</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f3ef; color: #30261f; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; color: #5b3825; }
    .subtitle { margin: 0 0 24px; color: #6c5b4d; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 18px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #cfc1b6; border-radius: 6px; font-size: 1rem; }
    button { padding: 11px 18px; border: 0; border-radius: 6px; background: #74482e; color: #fff; cursor: pointer; font-size: 1rem; }
    button:hover { background: #5b3825; }
    .status { min-height: 24px; margin: 10px 0; color: #6c5b4d; }
    .status.error { color: #a32929; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px #30261f14; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid #eee5df; text-align: left; }
    th { background: #eee5df; color: #5b3825; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .empty { text-align: center; color: #806e60; padding: 30px; }
    .tier { display: inline-block; padding: 3px 9px; border-radius: 20px; background: #f0e0d2; color: #74482e; font-size: .9rem; }
    @media (max-width: 540px) { main { padding: 24px 12px; } .toolbar { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>สมาชิกและแต้มสะสม</h1>
    <p class="subtitle">ค้นหาด้วยเลขสมาชิกหรือชื่อสมาชิก · <a href="/member_create.html">สมัครสมาชิกใหม่</a> · <a href="/purchase.html">บันทึกยอดซื้อ</a></p>
    <form class="toolbar" id="search-form">
      <input id="search-input" type="search" placeholder="เช่น M000001 หรือ สมชาย" aria-label="ค้นหาสมาชิก">
      <button type="submit">ค้นหา</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>เลขสมาชิก</th><th>ชื่อ</th><th>เบอร์โทร</th><th>แต้มรวม</th><th>ระดับ</th></tr></thead>
        <tbody id="members-body"></tbody>
      </table>
    </div>
  </main>
  <script src="/index.js" defer></script>
</body>
</html>
